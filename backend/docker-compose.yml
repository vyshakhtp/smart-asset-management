services:

  web:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && gunicorn smartAssetAndInventoryManagementSystem.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles


  db:
    image: postgres:15

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  frontend:
    build: ../frontend

    ports:
      - "3000:80"

    depends_on:
      - web


  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/staticfiles:ro

    depends_on:
      - web
      - frontend


volumes:
  postgres_data:
  static_volume: